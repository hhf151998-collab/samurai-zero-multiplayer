<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Samurai Zero</title><style>*{box-sizing:border-box}body{margin:0;background:#090b19;color:#e9faff;font:16px monospace;text-align:center}h1{color:#66faff;text-shadow:3px 3px #e53585}input,select,button{background:#17243a;color:white;border:1px solid #48e4f4;padding:12px;border-radius:6px;font:inherit;margin:5px}button{cursor:pointer}#lobby{max-width:520px;margin:8vh auto;padding:20px}canvas{width:100%;height:100%;object-fit:contain;display:block}#game{position:fixed;inset:0;display:none}#hud{position:absolute;top:8px;left:0;right:0;pointer-events:none;font-weight:bold;text-shadow:1px 2px black}#controls{position:absolute;bottom:15px;left:12px;right:12px;display:flex;justify-content:space-between;touch-action:none}#pad{width:115px;height:115px;border:2px solid #58c9df;border-radius:50%;background:#19354a88;touch-action:none}#actions{display:flex;align-items:end}#actions button{touch-action:none;padding:15px}#waiting{position:absolute;top:35%;left:0;right:0}small{color:#a6b8d1}@media(max-width:600px){#lobby{margin:2vh auto}#actions button{padding:10px;margin:2px;font-size:12px}#pad{width:95px;height:95px}#hud{font-size:12px}#status{font-size:16px}}#waiting{background:#090b19dd;padding:16px}#controls{pointer-events:none}#pad,#actions{pointer-events:auto}</style></head><body><section id="lobby"><h1>SAMURAI ZERO</h1><h2>PIXEL CLASH // 5v5</h2><p>Enter the neon battlefield.</p><input id="name" aria-label="Player name" maxlength="18" placeholder="Player name" value="RONIN"><br><input id="code" aria-label="Room code" maxlength="12" placeholder="Room code (blank to create)"><br><select id="team" aria-label="Team"><option value="0">Crimson</option><option value="1">Azure</option></select><select id="cls" aria-label="Character"><option value="0">Shadow Ronin</option><option value="1">Cyber Guardian</option><option value="2">Neon Tech-Ninja</option></select><br><button id="join">ENTER ROOM</button><p id="msg"></p><small>WASD / arrows · J attack · Space dash · K skill<br>Mobile: joystick + action buttons</small></section><section id="game"><canvas id="cv" width="1600" height="1000"></canvas><div id="hud"></div><div id="waiting"><h2 id="status"></h2><button id="share">COPY INVITE LINK</button><button id="start">START MATCH</button></div><div id="controls"><div id="pad"></div><div id="actions"><button data-act="d">DASH</button><button data-act="s">SKILL</button><button data-act="a">SLASH</button></div></div></section><script src="/socket.io/socket.io.js"></script><script>const $=id=>document.getElementById(id),socket=io(),ctx=$('cv').getContext('2d');let id,room,state,keys={},touch={x:0,y:0},act={};$('code').value=new URLSearchParams(location.search).get('room')||'';$('join').onclick=()=>socket.emit('join',{name:$('name').value,code:$('code').value,team:$('team').value,cls:$('cls').value});socket.on('disconnect',()=>{$('lobby').style.display='block';$('game').style.display='none';$('code').value=room||$('code').value;id=null;state=null;$('msg').textContent='Connection lost. Reconnecting…'});socket.on('connect',()=>{$('msg').textContent='Connected — enter your room'});socket.on('connect_error',()=>{$('msg').textContent='Connecting to server… Please wait or retry.'});socket.on('errorMsg',m=>$('msg').textContent=m);socket.on('joined',d=>{id=d.id;room=d.code;history.replaceState(null,'','/?room='+room);$('lobby').style.display='none';$('game').style.display='block'});$('share').onclick=async()=>{let u=location.origin+'/?room='+room;try{await navigator.clipboard.writeText(u);$('share').textContent='COPIED!'}catch{prompt('Invite link',u)}};$('start').onclick=()=>socket.emit('start');socket.on('state',s=>{state=s;$('waiting').style.display=s.active?'none':'block';$('start').style.display=s.host===id?'inline-block':'none';$('status').textContent=s.time===0?'MATCH OVER — '+(s.score[0]===s.score[1]?'DRAW':s.score[0]>s.score[1]?'CRIMSON WINS':'AZURE WINS'):'ROOM '+s.code+' | '+s.p.filter(p=>!p.bot).length+' players — '+s.p.filter(p=>!p.bot).map(p=>p.name+' ('+(p.t?'Azure':'Crimson')+')').join(', ');$('hud').textContent='CRIMSON '+Math.floor(s.score[0])+'  |  '+Math.ceil(s.time)+'s  |  '+Math.floor(s.score[1])+' AZURE · '+(s.p.find(p=>p.id===id)?.dead?'RESPAWNING':'HP '+(s.p.find(p=>p.id===id)?.hp??100));});onkeydown=e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()};onkeyup=e=>keys[e.code]=false;onblur=()=>{keys={};act={};touch={x:0,y:0}};let pad=$('pad');function move(e){let r=pad.getBoundingClientRect();touch={x:e.clientX-r.left-r.width/2,y:e.clientY-r.top-r.height/2}}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);move(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))move(e)};pad.onpointerup=pad.onpointercancel=()=>touch={x:0,y:0};document.querySelectorAll('[data-act]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);act[b.dataset.act]=true};b.onpointerup=b.onpointercancel=()=>act[b.dataset.act]=false});setInterval(()=>{if(id)socket.emit('input',{x:touch.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),y:touch.y+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0),a:!!(act.a||keys.KeyJ),d:!!(act.d||keys.Space),s:!!(act.s||keys.KeyK)})},50);function draw(){requestAnimationFrame(draw);if(!state)return;ctx.fillStyle='#10162a';ctx.fillRect(0,0,1600,1000);ctx.strokeStyle='#20344a';for(let x=0;x<1600;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,1000);ctx.stroke()}for(let y=0;y<1000;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1600,y);ctx.stroke()}ctx.strokeStyle='#f8d66d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(800,500,95,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#f8d66d';ctx.fillRect(785,485,30,30);for(let p of state.p){if(p.dead)continue;let c=p.t?'#39d9ff':'#ff467b';ctx.fillStyle=c;ctx.fillRect(p.x-17,p.y-20,34,40);ctx.fillStyle='#0b1020';ctx.fillRect(p.x-12,p.y-12,24,8);ctx.fillStyle='#fff';ctx.fillRect(p.x-9,p.y-10,5,3);ctx.fillRect(p.x+4,p.y-10,5,3);ctx.fillStyle=c;ctx.fillRect(p.x-23,p.y-32,46*p.hp/100,5);ctx.font='17px monospace';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(p.name,p.x,p.y-39);if(p.id===id){ctx.strokeStyle='white';ctx.strokeRect(p.x-23,p.y-24,46,48)}if(Date.now()-p.flash<180){ctx.strokeStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,70,0,Math.PI*2);ctx.stroke()}}}draw();</script></body></html>
